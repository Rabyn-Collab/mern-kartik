<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .flex-box {
        max-width: 500px;
        display: flex;
        border: 1px solid black;
      }

      .bx1 {
        background-color: red;
        flex-grow: 1;
      }

      .bx2 {
        background-color: aqua;
        flex-grow: 2;
      }
    </style>
  </head>

  <body>

    <div class="flex-box">
      <div class="bx1">
        <h3>Box1</h3>

      </div>
      <div class="bx2">
        <h3>Box3</h3>

      </div>
    </div>

  </body>

</html>
