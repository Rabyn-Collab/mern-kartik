    <fieldset>
      <legend>Contact</legend>

      <form action="mailto:rabyn900@gmail.com" method="post" enctype="text/plain">

        <p>
          <label for="email">Email</label>
          <input name="email" id="email" type="email" placeholder="example@gmail.com">
        </p>

        <p>
          <label for="fullname">Username</label>
          <input name="fullname" id="fullname" type="text" placeholder="John Doe">
        </p>

        <p>
        <h3>Select Your Gender</h3>
        <label for="male">Male</label>
        <input type="radio" id="male" value="male" name="gender">
        <label for="female">Female</label>
        <input type="radio" id="female" value="female" name="gender">
        </p>


        <p>
        <h3>Select Your Habits</h3>
        <label for="dance">Dance</label>
        <input type="checkbox" id="dance" value="dance" name="habits">
        <label for="sing">Sing</label>
        <input type="checkbox" id="sing" value="sing" name="habits">
        </p>
        <p>
          <label for="country">Select Your Country:- </label>
          <select name="country" id="country">
            <!-- <option value="nepal"> Nepal</option> -->

            <optgroup label="Nepal">
              <option value="Kathmandu">Kathmandu</option>
              <option value="Bhaktapur">Bhaktapur</option>
              <option value="Lalitpur">Lalitpur</option>
            </optgroup>

            <option value="india"> India</option>
            <option value="china"> China</option>
          </select>
        </p>

        <p>
        <h4>Your Feed Back</h4>
        <textarea name="feedback" id="feed" rows="5" cols="30"></textarea>

        </p>

        <button type="submit">Submit</button>





      </form>

    </fieldset>
