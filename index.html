    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playwrite+CZ:wght@100..400&display=swap');

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .bx {
        height: 200px;
        width: 200px;
        background-color: red;
        position: absolute;
        z-index: 3;
      }

      .bx1 {
        height: 200px;
        width: 200px;
        background-color: green;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1;
      }

      .bx2 {
        height: 200px;
        width: 200px;
        background-color: blue;
        position: absolute;
        top: 40px;
        left: 40px;
        z-index: 2;
      }
    </style>

  </head>
